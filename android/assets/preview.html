<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenCompanion 0.1.1 预览</title>
<style>
  :root{--bg:#0d0f14;--card:#171b24;--line:#262c38;--fg:#f2f4f8;
        --dim:#8b93a1;--dim2:#5f6775;--accent:#c41d3b;--accent2:#e2334f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif;padding:32px 24px 60px}
  h1{font-size:30px;font-weight:900;letter-spacing:-1px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:26px}
  .hint{color:var(--dim2);font-size:12px;margin-top:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
  .card{background:var(--card);border:1.5px solid var(--line);overflow:hidden}
  .card h3{margin:0;padding:12px 14px;font-size:14px;font-weight:800;
           border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
           align-items:center}
  .card h3 a{font-size:11px;color:var(--accent2);text-decoration:none;font-weight:600}
  .card h3 a:hover{text-decoration:underline}
  .frame{width:100%;height:720px;border:0;display:block;background:#000}
  .key{font-size:11px;color:var(--dim2);padding:9px 14px;border-top:1px solid var(--line);
       font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<h1>OpenCompanion 0.1.1</h1>
<div class="sub">点每个框可以独立操作，主题互不影响</div>
<div class="grid" id="grid"></div>
<div class="hint" id="hint"></div>

<script>
const THEMES = [
  ['crimson','赤潮（默认）'],['bauhaus','包豪斯'],['constructivism','构成主义'],
  ['dada','达达'],['pixel','像素'],['ink','水墨'],['glitch','故障'],
  ['glass','液体玻璃'],['nordic','北欧'],['terminal','终端'],['memphis','孟菲斯'],
  ['indigo','靛蓝'],['paper','纸白'],['moss','苔绿'],['amber','琥珀'],
  ['graphite','石墨'],['sunset','日落'],
];

const grid = document.getElementById('grid');
THEMES.forEach(([key, name], i) => {
  const d = document.createElement('div');
  d.className = 'card';
  // 每个 iframe 用不同位置打开，避免共用 localStorage 时主题互相覆盖
  d.innerHTML = `<h3><span>${name}</span>
      <a href="index.html?theme=${key}" target="_blank">单独打开 ↗</a></h3>
    <iframe class="frame" src="index.html?theme=${key}" loading="lazy"></iframe>
    <div class="key">?theme=${key}</div>`;
  grid.appendChild(d);
});
document.getElementById('hint').textContent =
  '共 ' + THEMES.length + ' 套主题。每套的配色、字体、圆角、描边、纹理、动效节奏都不同。';
</script>
</body>
</html>
