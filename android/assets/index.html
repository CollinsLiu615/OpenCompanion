<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenCompanion</title>
<style>
:root{--bg:#ffffff;--card:#ffffff;--line:#e3e6eb;--fg:#1a1d23;--dim:#6b7280;--accent:#4b6ef5;--ok:#12a15c;--err:#d93025}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:15px/1.7 -apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--fg);
     display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex:1;overflow-y:auto;padding:20px 16px;padding-top:calc(20px + env(safe-area-inset-top))}
.screen.on{display:block}
#chatScreen{display:none;flex-direction:column;padding:0;overflow:hidden}
#chatScreen.on{display:flex}
h2{font-size:19px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:18px}
label{display:block;font-size:12px;color:var(--dim);margin:14px 0 6px}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
     background:#f7f8fa;color:var(--fg);font:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
button{padding:13px 20px;border-radius:10px;border:none;background:var(--accent);color:#fff;
       font:inherit;font-weight:600;cursor:pointer;width:100%;margin-top:12px}
button:disabled{opacity:.5}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.msg{margin-top:12px;padding:11px;border-radius:10px;font-size:13px;display:none;word-break:break-word}
.msg.ok{display:block;background:#12291f;color:var(--ok)}
.msg.err{display:block;background:#2b1616;color:var(--err)}
/* 聊天页 */
header{flex-shrink:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
       background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header img,header .ph{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#f7f8fa;
       display:flex;align-items:center;justify-content:center;color:#9aa3b2}
header .nm{font-weight:600;font-size:15px}
header .bk{margin-left:auto;font-size:14px;color:var(--dim);padding:6px}
#log{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:82%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.ta{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.sys{align-self:center;color:var(--dim);font-size:12px}
#bar{flex-shrink:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
     background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
#msg{flex:1;padding:11px 14px;border-radius:20px;border:1px solid var(--line);background:#f7f8fa;
     color:var(--fg);font:inherit;resize:none;outline:none;max-height:100px}
#send{padding:0 18px;height:42px;border-radius:20px;border:none;background:var(--accent);
      color:#fff;font:inherit;font-weight:600;width:auto;margin:0;flex-shrink:0}
.row{display:flex;gap:10px}
.row button{flex:1}
.av{display:flex;align-items:center;gap:14px;margin-top:8px}
.av img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#f7f8fa;border:2px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.p{display:flex;gap:12px;align-items:center;padding:14px;background:var(--card);border:1px solid var(--line);
   border-radius:14px;margin-bottom:10px}
.p img,.p .ph{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#f7f8fa;
   display:flex;align-items:center;justify-content:center;color:#9aa3b2;font-size:19px;flex-shrink:0}
.p .nm{font-weight:600}
.p .meta{font-size:12px;color:var(--dim)}

/* ══════ 启动动画 ══════ */
#splash{position:fixed;inset:0;background:#fff;z-index:1000;display:flex;
        align-items:center;justify-content:center;cursor:pointer}
.stage{position:absolute;inset:0;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:20px;opacity:0;
       transition:opacity .55s ease;padding:24px}
.stage.show{opacity:1}
#blackout{position:fixed;inset:0;background:#eef0f3;z-index:1010;opacity:0;
          pointer-events:none;transition:opacity .38s ease}
#blackout.on{opacity:1}
#brandIcon{width:150px;height:150px;image-rendering:pixelated;
           transform:scale(.72);opacity:0;transition:all .7s cubic-bezier(.2,.9,.3,1.2)}
#brandIcon.in{transform:scale(1);opacity:1}
.brandName{opacity:0;transform:translateY(14px);transition:all .6s ease}
.brandName.in{opacity:1;transform:translateY(0)}
#zh{width:min(250px,60vw);height:auto}
#en{width:min(360px,82vw);height:auto}
#bzMark{width:190px;height:190px;opacity:0;transform:scale(.86);
        transition:all .85s cubic-bezier(.2,.9,.3,1.1)}
#bzMark.in{opacity:1;transform:scale(1)}
#bzWord{margin-top:24px;font-size:18px;letter-spacing:.16em;color:#2b2f38;
        font-weight:300;opacity:0;transition:opacity .8s ease}
#bzWord.in{opacity:1}
#skipHint{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));
          font-size:12px;color:#b9bfc9;opacity:0;transition:opacity .6s}
#skipHint.in{opacity:1}

/* ══════ 协议门 ══════ */
#consent{position:fixed;inset:0;background:#fff;z-index:1020;display:none;
         align-items:center;justify-content:center;padding:14px}
#consent.on{display:flex}
#consent .box{width:100%;max-height:calc(100vh - 28px);background:#fff;
              border:1px solid var(--line);border-radius:16px;display:flex;
              flex-direction:column;overflow:hidden}
#consent .hd{padding:18px 18px 12px;border-bottom:1px solid var(--line);background:#fafbfc}
#consent .hd h2{margin:0 0 4px;font-size:17px}
#consent .hd p{margin:0;font-size:11px;color:var(--dim)}
#consent .bd{flex:1;overflow-y:auto;padding:14px 18px;font-size:13px;line-height:1.85;color:#3a4048}
#consent .bd h3{font-size:13.5px;margin:16px 0 6px;color:#14171c}
#consent .bd p{margin:0 0 8px}
#consent .bd strong{color:#000}
#consent .chk{display:flex;gap:9px;align-items:flex-start;padding:12px 18px 0;
              font-size:13px;color:#3a4048}
#consent .chk input{margin-top:3px;flex-shrink:0;width:18px;height:18px;accent-color:var(--accent)}
#consent .warn{margin:8px 18px 0;padding:8px 11px;border-radius:8px;font-size:12px;
               background:#fdecec;color:#c62828;display:none}
#consent .warn.on{display:block}
#consent .ft{padding:12px 18px calc(12px + env(safe-area-inset-bottom));
             border-top:1px solid var(--line);display:flex;gap:10px}
#consent button{flex:1;padding:13px;border-radius:10px;border:none;font:inherit;
                font-weight:600;cursor:pointer;margin:0}
#btnAgree{background:var(--accent);color:#fff}
#btnAgree:disabled{opacity:.45}
#btnDecline{background:#f4f5f7;border:1px solid var(--line);color:#4a505a}

/* ══════ 退出态 ══════ */
#bye{position:fixed;inset:0;background:#fff;z-index:1030;display:none;
     align-items:center;justify-content:center;flex-direction:column;gap:14px;
     padding:24px;text-align:center}
#bye.on{display:flex}
#bye h2{margin:0;font-size:18px;font-weight:500}
#bye p{margin:0;font-size:14px;color:var(--dim);max-width:360px;line-height:1.8}
#bye .again{margin-top:8px;padding:11px 26px;border-radius:10px;border:1px solid var(--line);
            background:#f4f5f7;color:var(--fg);font:inherit;cursor:pointer}

/* ══════ 设置面板 / 抽屉 ══════ */
.sheet{position:fixed;left:0;right:0;bottom:0;top:0;background:#fff;z-index:900;
       display:flex;flex-direction:column;transform:translateX(102%);
       transition:transform .26s cubic-bezier(.3,.9,.4,1);visibility:hidden}
.sheet.on{transform:translateX(0);visibility:visible}
.sheet.maskSheet{background:rgba(15,20,30,.4);justify-content:flex-end}
.sheetHd{padding:calc(14px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;justify-content:space-between;background:#fafbfc}
.sheetHd h3{margin:0;font-size:16px}
.xbtn{width:34px;height:34px;border-radius:9px;border:none;background:transparent;
      color:var(--dim);font-size:16px;cursor:pointer}
.sheetBd{flex:1;overflow-y:auto;padding:18px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.sblock{margin-bottom:26px}
.sblock h4{margin:0 0 10px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.06em}
.sblock label{display:block;font-size:12px;color:var(--dim);margin:10px 0 5px}
.sblock input,.sblock textarea{width:100%;padding:11px 12px;border-radius:9px;
       border:1px solid var(--line);background:#f7f8fa;color:var(--fg);font:inherit;outline:none}
.sblock input:focus,.sblock textarea:focus{border-color:var(--accent)}
.sblock textarea{resize:vertical;line-height:1.7}
.avrow{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.avrow img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#f0f2f5;
           border:2px solid var(--line);flex-shrink:0}
.sbtn{display:block;width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);
      background:#fff;color:var(--fg);font:inherit;cursor:pointer;text-align:center;
      margin-bottom:9px;margin-top:0}
.sbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.sbtn.danger{color:#d93025;border-color:#f0c4c4}
.hint{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.6}
/* 抽屉里的列表 */
#plistSheet .box{background:#fff;border-radius:16px 16px 0 0;max-height:82vh;
                 display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#plistSheet .ph2{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;
                 align-items:center;justify-content:space-between}
#plistSheet .ph2 h3{margin:0;font-size:15px}
#plistSheet .list{flex:1;overflow-y:auto;padding:8px}
#plistSheet .ft{padding:12px 14px;border-top:1px solid var(--line)}
.pitem{display:flex;gap:12px;align-items:center;padding:12px;border-radius:11px;cursor:pointer}
.pitem.cur{background:#eef2ff;border:1px solid #c7d2fe}
.pitem img,.pitem .ph{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#f0f2f5;
       display:flex;align-items:center;justify-content:center;color:#9aa3b2;font-size:17px;flex-shrink:0}
.pitem .pnm{font-weight:600;font-size:14px}
.pitem .pmeta{font-size:11px;color:var(--dim)}
</style>
</head>
<body>

<!-- ══════ 启动动画 ══════ -->
<div id="splash">
  <div class="stage" id="stage1">
    <img id="brandIcon" src="brand/icon-480.png" alt="">
    <img id="zh" class="brandName" src="brand/name_zh.png" alt="">
    <img id="en" class="brandName" src="brand/name_en.png" alt="">
  </div>
  <div class="stage" id="stage2">
    <img id="bzMark" src="brand/benzene.png" alt="">
    <div id="bzWord">Benzene AI Studio</div>
  </div>
  <div id="skipHint">点击跳过</div>
</div>
<div id="blackout"></div>

<!-- ══════ 协议门 ══════ -->
<div id="consent">
  <div class="box">
    <div class="hd">
      <h2>用户协议与隐私政策</h2>
      <p>版本 v1.0 · 生效日期 2026 年 11 月 17 日</p>
    </div>
    <div class="bd" id="consentBody"></div>
    <div class="chk">
      <input type="checkbox" id="agreeChk">
      <label for="agreeChk">我已阅读并同意《用户协议与隐私政策》的全部条款</label>
    </div>
    <div class="warn" id="warn">请先勾选上方选项，才能继续。</div>
    <div class="ft">
      <button id="btnDecline">不同意，退出</button>
      <button id="btnAgree" disabled>我已阅读并同意</button>
    </div>
  </div>
</div>

<!-- ══════ 退出态 ══════ -->
<div id="bye">
  <h2>已停止使用</h2>
  <p>您未同意《用户协议与隐私政策》，本软件无法继续使用。</p>
  <button class="again" id="btnAgain">重新阅读协议</button>
</div>

<!-- ① 配置 -->
<div class="screen on" id="s1">
  <h2>连接 AI</h2>
  <div class="sub">本软件不自带 AI 能力，需填写你自己的接口信息。去服务商后台就能找到这三项。</div>
  <label>接口地址（base_url）</label>
  <input id="base_url" placeholder="https://你的服务商域名/v1" autocapitalize=off autocorrect=off spellcheck=false>
  <label>API Key</label>
  <input id="api_key" type="password" placeholder="粘贴你的 API Key" autocapitalize=off autocorrect=off spellcheck=false>
  <label>模型名</label>
  <input id="model" placeholder="你的服务商提供的模型名" autocapitalize=off autocorrect=off spellcheck=false>
  <button id="btn-test" class="ghost">测试连接</button>
  <button id="btn-next1">下一步</button>
  <div class="msg" id="m1"></div>
</div>

<!-- ② 人设 -->
<div class="screen" id="s2">
  <h2>它是个什么样的人</h2>
  <div class="sub">用大白话写，AI 会帮你写成完整人设</div>
  <label>名字</label>
  <input id="name" placeholder="小D">
  <label>一句话描述</label>
  <textarea id="brief" placeholder="嘴硬心软的女大学生，会吐槽我但很关心我"></textarea>
  <button id="btn-refine">让 AI 写完整人设</button>
  <button id="btn-back1" class="ghost">返回</button>
  <div class="msg" id="m2"></div>
</div>

<!-- ③ 完善 -->
<div class="screen" id="s3">
  <h2>完整人设</h2>
  <div class="sub">不满意直接改</div>
  <textarea id="persona" style="min-height:260px;font-size:13px;line-height:1.7"></textarea>
  <label>头像</label>
  <div class="av">
    <img id="avpre" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'%3E%3Crect width='72' height='72' fill='%2311151b'/%3E%3Ctext x='36' y='46' font-size='26' text-anchor='middle' fill='%238b93a1'%3E%3F%3C/text%3E%3C/svg%3E">
    <input type="file" id="avatar" accept="image/*" style="font-size:12px;border:none;background:none;padding:0">
  </div>
  <button id="btn-save">完成</button>
  <button id="btn-again" class="ghost">重新生成</button>
  <div class="msg" id="m3"></div>
</div>

<!-- 列表 -->
<div class="screen" id="sList">
  <h2>我的伴侣</h2>
  <div class="sub">点一个开始聊天</div>
  <div id="plist"></div>
  <button id="btn-new">＋ 新建一个</button>
</div>

<!-- 聊天 -->
<div id="chatScreen">
  <header>
    <div class="bk" id="btnList">☰</div>
    <img id="chAv" style="display:none"><div class="ph" id="chPh">?</div>
    <div style="min-width:0"><div class="nm" id="chNm"></div></div>
    <div class="bk" id="btnSet" style="margin-left:auto">⚙</div>
  </header>
  <div id="log"></div>
  <div id="bar">
    <textarea id="msg" rows="1" placeholder="说点什么…"></textarea>
    <button id="send">发送</button>
  </div>
</div>

<!-- ══════ 设置面板 ══════ -->
<div class="sheet" id="settings">
  <div class="sheetHd">
    <h3>设置</h3>
    <button class="xbtn" id="btnCloseSet">✕</button>
  </div>
  <div class="sheetBd">
    <div class="sblock">
      <h4>人设</h4>
      <div class="avrow">
        <img id="setAv" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 72 72'%3E%3Crect width='72' height='72' fill='%23f0f2f5'/%3E%3Ctext x='36' y='46' font-size='26' text-anchor='middle' fill='%239aa3b2'%3E%3F%3C/text%3E%3C/svg%3E">
        <div style="flex:1">
          <input type="file" id="setAvFile" accept="image/*" style="font-size:12px;border:none;background:none;padding:0">
          <div class="hint">更换头像，自动裁成正方形</div>
        </div>
      </div>
      <label>名字</label>
      <input id="setName" placeholder="角色名字">
      <label>一句话简介</label>
      <input id="setBrief" placeholder="当初的描述">
      <label>完整人设</label>
      <textarea id="setPersona" rows="10"></textarea>
      <button class="sbtn primary" id="btnSavePersona">保存修改</button>
    </div>

    <div class="sblock">
      <h4>对话记录</h4>
      <button class="sbtn" id="btnExport">导出对话（复制到剪贴板）</button>
      <button class="sbtn danger" id="btnClear">清除聊天记录</button>
    </div>

    <div class="sblock">
      <h4>删除</h4>
      <button class="sbtn danger" id="btnDelete">删除这个人物</button>
      <div class="hint">连同人设、头像、全部对话一起删除，不可恢复。</div>
    </div>
  </div>
</div>

<!-- ══════ 人物列表抽屉 ══════ -->
<div class="sheet maskSheet" id="plistSheet"></div>

<script>
/* ══════════ 基础设施 ══════════ */
const $ = s => document.querySelector(s);
const hasNative = typeof Native !== 'undefined';
const PRESETS = [];  // 不预设任何服务商，全部由用户填写

// 存储：优先用原生 SharedPreferences（安卓），否则 localStorage（浏览器预览）
const store = {
  get(k, d) {
    try {
      if (hasNative) {
        const v = k === 'config' ? Native.getConfig() : Native.getPersonas();
        return JSON.parse(v) || d;
      }
      return JSON.parse(localStorage.getItem('oc_' + k)) || d;
    } catch(e) { return d; }
  },
  set(k, v) {
    try {
      const s = JSON.stringify(v);
      if (hasNative) { k === 'config' ? Native.saveConfig(s) : Native.savePersonas(s); }
      else localStorage.setItem('oc_' + k, s);
    } catch(e) {}
  }
};
let cfg = store.get('config', {});
let personas = store.get('personas', []);

function show(sc) {
  document.querySelectorAll('.screen').forEach(e => e.classList.remove('on'));
  $('#chatScreen').classList.remove('on');
  if (sc === 'chat') $('#chatScreen').classList.add('on');
  else $(sc).classList.add('on');
}
function tip(el, ok, text) {
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.textContent = (ok ? '✓ ' : '✗ ') + text;
}

/* ══════════ AI 调用（安卓走原生桥，浏览器走 fetch）══════════ */
let _seq = 0;
const _pending = {};
window.__ocChatDone = (id, json) => {
  const cb = _pending[id];
  if (cb) { delete _pending[id]; cb(JSON.parse(json)); }
};

function aiCall(messages, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    const t = opts.temperature !== undefined ? opts.temperature : 0.9;
    const mt = opts.maxTokens || 800;
    if (hasNative) {
      const id = 'c' + (++_seq);
      _pending[id] = resolve;
      Native.chat(id, cfg.base_url, cfg.api_key, cfg.model,
                  JSON.stringify(messages), t, mt);
      return;
    }
    // 浏览器预览：走 fetch
    fetch(cfg.base_url.replace(/\/+$/, '') + '/chat/completions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.api_key},
      body: JSON.stringify({model: cfg.model, messages, temperature: t, max_tokens: mt})
    }).then(r => r.json().then(j => ({code: r.status, j})))
      .then(({code, j}) => {
        if (code >= 200 && code < 300) {
          resolve({ok: true, text: (j.choices[0].message.content || '').trim()});
        } else {
          resolve({ok: false, error: '请求失败(' + code + ')：' + JSON.stringify(j).slice(0, 200)});
        }
      })
      .catch(e => resolve({ok: false, error: '网络错误：' + e.message}));
  });
}

/* ══════════ ① 配置 ══════════ */
// 不预设任何服务商，一切由用户填写
if (cfg.base_url) $('#base_url').value = cfg.base_url;
if (cfg.model) $('#model').value = cfg.model;
if (cfg.api_key) $('#api_key').placeholder = '已保存，留空不修改';

$('#btn-test').onclick = async () => {
  const b = $('#btn-test');
  const tmp = {
    base_url: $('#base_url').value.trim(),
    api_key: $('#api_key').value.trim() || cfg.api_key || '',
    model: $('#model').value.trim()
  };
  if (!tmp.base_url || !tmp.model || !tmp.api_key) {
    tip($('#m1'), false, '三项都填完整才能测试'); return;
  }
  b.disabled = true; b.textContent = '测试中…';

function esc(s) {

let cur = null, busy = false;
function openChat(id) {
  cur = personas.find(p => p.id === id);
  if (!cur) return;
  if (cur.avatar) { $('#chAv').src = cur.avatar; $('#chAv').style.display = ''; $('#chPh').style.display = 'none'; }
  else { $('#chAv').style.display = 'none'; $('#chPh').style.display = 'flex'; $('#chPh').textContent = cur.name.slice(0,1); }
  $('#chNm').textContent = cur.name;
  $('#log').innerHTML = '';

  show('chat');

}
function addBubble(text, cls) {
  const d = document.createElement('div');
  d.className = 'm ' + cls;
  d.textContent = text;
  $('#log').appendChild(d);
  return d;
}
function scrollBottom() { const l = $('#log'); l.scrollTop = l.scrollHeight; }

function systemPrompt(p) {
  const now = new Date();
  const wd = '日一二三四五六'[now.getDay()];
  const ts = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-'
           + String(now.getDate()).padStart(2,'0') + ' '
           + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  return `【当前时间】${ts} 星期${wd}\n`
       + `你可以参考这个时间调整语气，但不要念时间数据。\n\n`
       + `你现在扮演「${p.name}」。人设如下，请完全按照它回应：\n\n${p.persona || p.brief}\n\n`
       + `始终以角色身份说话，不要提及自己是 AI 模型。回答自然口语化，不用列表，不长篇大论。`;
}

async function doSend() {
  const box = $('#msg');
  const text = box.value.trim();
  if (!text || busy || !cur) return;
  box.value = ''; busy = true; $('#send').disabled = true;
  addBubble(text, 'me'); scrollBottom();
  const think = addBubble('正在输入…', 'sys');

  const msgs = [{role:'system', content: systemPrompt(cur)}];
  (cur.history || []).slice(-40).forEach(m => msgs.push({role: m.role, content: m.content}));
  msgs.push({role:'user', content: text});

  const r = await aiCall(msgs);
  think.remove();
  if (r.ok) {
    addBubble(r.text, 'ta');
    cur.history.push({role:'user', content: text});
    cur.history.push({role:'assistant', content: r.text});
    if (cur.history.length > 200) cur.history = cur.history.slice(-200);
    store.set('personas', personas);
  } else {
    addBubble('出错了：' + r.error, 'sys');
  }
  busy = false; $('#send').disabled = false;
  scrollBottom();
}
$('#send').onclick = doSend;

/* toast */
function toast(t) {
  if (hasNative && Native.toast) { try { Native.toast(t); return; } catch(e) {} }
  let el = document.getElementById('__toast');
  if (!el) {
    el = document.createElement('div'); el.id = '__toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);'
      + 'background:#1f2530;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;'
      + 'z-index:2000;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap';
    document.body.appendChild(el);
  }
  el.textContent = t;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 1800);
}

async function runSplash() {
  const sp = $('#splash');
  const s1 = $('#stage1'), s2 = $('#stage2');
  const icon = $('#brandIcon'), zh = $('#zh'), en = $('#en');
  const bz = $('#bzMark'), bzWord = $('#bzWord');

    // 老用户：短动画

    enterApp();
    return;
  }

  // 第一屏：图标 → 中文 → 英文
  s1.classList.add('show');
  await wait(150); icon.classList.add('in');
  await wait(680); zh.classList.add('in');
  await wait(500); en.classList.add('in');
  await wait(1450);

  await wait(780); bzWord.classList.add('in');

  splashDone = true;

}

function showConsent() {
  consentEl.classList.add('on');
  agreeChk.checked = false;
  btnAgree.disabled = true;
}
agreeChk.addEventListener('change', () => {
  btnAgree.disabled = !agreeChk.checked;
  if (agreeChk.checked) warnEl.classList.remove('on');
});
btnAgree.onclick = () => {
  if (!agreeChk.checked) { warnEl.classList.add('on'); return; }
  setAgreed();
  consentEl.classList.remove('on');
  enterApp();
};
$('#btnDecline').onclick = () => {
  consentEl.classList.remove('on');
  byeEl.classList.add('on');
  try { if (hasNative && Native.quit) Native.quit(); } catch(e) {}
};
$('#btnAgain').onclick = () => {
  byeEl.classList.remove('on');
  showConsent();
};
