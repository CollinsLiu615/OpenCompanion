name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: 隐私与安全扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查硬编码密钥
        run: |
          if grep -rnE "sk-[a-zA-Z0-9]{20,}" \
             --include="*.py" --include="*.html" --include="*.java" \
             --include="*.js" --include="*.sh" . ; then
            echo "::error::发现疑似硬编码的 API Key"
            exit 1
          fi
          echo "✓ 无硬编码密钥"

      - name: 检查埋点 SDK
        run: |
          if grep -rniE "firebase|umeng|bugly|sentry|google-analytics" \
             --include="*.java" --include="*.html" --include="*.gradle" . ; then
            echo "::error::发现埋点 SDK 引用"
            exit 1
          fi
          echo "✓ 无埋点 SDK"

      - name: 检查硬编码服务器地址（Java）
        run: |
          # 规则：安卓 Java 代码里不得出现硬编码的服务端地址。
          # 用户的 API 请求必须发往自己填的 base_url，不能偷偷连别处。
          #
          # 允许的例外（白名单，需在 PR 中说明理由）：
          #   1. api.github.com —— 检查更新，只读公开版本信息，
          #      已在用户协议与 SECURITY.md 中披露，且用户可关闭
          # 排除的误报：
          #   2. "https:// 开头" 这类错误提示文案
          #   3. XML 命名空间 URI（schemas.android.com 等）
          HITS=$(grep -rnE "https?://[a-zA-Z0-9]" --include="*.java" android/app/src/ \
                 | grep -vE "schemas\.android\.com|w3\.org|schemas\.xml\.org" \
                 | grep -vE "https?:// 开头" \
                 | grep -vE "api\\.github\\.com/repos/CollinsLiu615/OpenCompanion/releases" || true)
          if [ -n "$HITS" ]; then
            echo "::error::Java 代码中发现未授权的硬编码 URL："
            echo "$HITS"
            echo ""
            echo "如果这是有意为之，请在本步骤的白名单中登记并说明理由。"
            exit 1
          fi
          echo "✓ Java 代码无未授权的硬编码 URL"

      - name: 检查版本检查地址是否与协议一致
        run: |
          # 版本检查是唯一的外连例外，必须与文档披露的一致。
          # 若仓库名或地址被改动而文档没跟上，这里会失败。
          if ! grep -q "api.github.com/repos/CollinsLiu615/OpenCompanion/releases/latest" \
               android/app/src/com/opencompanion/app/MainActivity.java; then
            echo "::error::版本检查地址与预期不符，请同步更新 SECURITY.md 与用户协议"
            exit 1
          fi
          if ! grep -q "api.github.com" SECURITY.md; then
            echo "::error::SECURITY.md 未披露版本检查的外部连接"
            exit 1
          fi
          echo "✓ 版本检查地址已披露且一致"

      - name: 检查私钥泄漏
        run: |
          if git ls-files | grep -qE "\.keystore$|\.jks$"; then
            echo "::error::仓库中包含了签名私钥"
            exit 1
          fi
          echo "✓ 无私钥入库"

  android-build:
    name: 安卓构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 安装 Android SDK
        run: |
          # 直接用 Google 官方命令行工具，不依赖第三方 action
          # （android-actions/setup-android 长期未维护，在新 runner 上会失败）
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: 接受许可并安装组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: 生成测试签名证书
        run: cd android && ./make-keystore.sh

      - name: 构建 APK
        run: |
          cd android
          ./build.sh

      - name: 验证 APK 可安装性
        run: |
          cd android
          BT=$ANDROID_SDK_ROOT/build-tools/36.1.0
          # targetSdkVersion 必须 >= 23，否则 Android 14+ 无法安装
          TARGET=$($BT/aapt2 dump badging OpenCompanion.apk | grep -oE "targetSdkVersion:'[0-9]+'" | grep -oE '[0-9]+')
          echo "targetSdkVersion = $TARGET"
          if [ "$TARGET" -lt 23 ]; then
            echo "::error::targetSdkVersion < 23，Android 14+ 将无法安装"
            exit 1
          fi
          $BT/apksigner verify OpenCompanion.apk
          echo "✓ APK 签名有效且可安装"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: OpenCompanion-apk
          path: android/OpenCompanion.apk
