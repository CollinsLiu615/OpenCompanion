name: SecretTest
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: 检查 secret 能否读到
        env:
          T: ${{ secrets.TEST_SECRET }}
          K: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "TEST_SECRET 长度: ${#T}"
          echo "KEYSTORE_B64 长度: ${#K}"
