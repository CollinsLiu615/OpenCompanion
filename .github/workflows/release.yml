name: Release

# 推一个 vX.Y.Z 的 tag 就自动构建并发布 Release。
# 这样发版不需要在本机手工上传 APK。
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 需要
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # build.sh 用 aapt2 / d8 / zipalign / apksigner，
      # 都是 build-tools 36.1.0 里的，必须自己装
      - name: 安装 Android SDK 组件
        run: |
          SDK=$ANDROID_SDK_ROOT
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" "build-tools;36.1.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          ls $SDK/build-tools/36.1.0/aapt2

      - name: 准备签名证书
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::缺少 secrets.RELEASE_KEYSTORE_B64，无法签名"
            exit 1
          fi
          # signing/ 在 .gitignore 里，checkout 后目录不存在，先建出来
          mkdir -p android/signing
          echo "$KS_B64" | base64 --decode > android/signing/release.keystore
          ls -la android/signing/release.keystore

      - name: 构建 APK
        env:
          OC_KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          OC_KS_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
        run: |
          cd android
          chmod +x build.sh
          ./build.sh

      - name: 校验包名与版本
        run: |
          cd android
          BT=$ANDROID_SDK_ROOT/build-tools/36.1.0
          BADGING=$($BT/aapt2 dump badging OpenCompanion.apk)
          echo "$BADGING" | head -1
          # tag 与 manifest 里的 versionName 必须一致，否则装上会显示错误版本
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(echo "$BADGING" | grep -oE "versionName='[^']+'" | cut -d"'" -f2)
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG 与 versionName $VER 不一致"
            exit 1
          fi
          echo "✓ 版本一致：$VER"
          $BT/apksigner verify OpenCompanion.apk && echo "✓ 签名有效"

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: android/OpenCompanion.apk
          name: OpenCompanion v${{ github.ref_name }}
          draft: false
          prerelease: false
          # 说明正文取自本地的 RELEASE_NOTES.md（存在才用），
          # 免得每次发版都要在网页上手工粘贴一遍
          body_path: RELEASE_NOTES.md
