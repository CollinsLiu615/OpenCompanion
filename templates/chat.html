<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>{{ persona.name }}</title>
<style>
:root{--bg:#ffffff;--card:#ffffff;--line:#e3e6eb;--fg:#1a1d23;--dim:#6b7280;--accent:#4b6ef5;--ok:#12a15c;--err:#d93025;--danger:#d93025}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
     background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
     height:100vh;height:100dvh;overflow:hidden}

/* ══════ 顶栏 ══════ */
header{flex-shrink:0;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);
       display:flex;align-items:center;gap:10px;position:relative;z-index:20}
.iconbtn{width:36px;height:36px;border-radius:9px;border:none;background:transparent;
         color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;
         font-size:19px;flex-shrink:0;transition:.15s}
.iconbtn:hover{background:#f0f2f5;color:var(--fg)}
header img,header .ph{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#f0f2f5;
       display:flex;align-items:center;justify-content:center;color:#9aa3b2;font-size:15px;flex-shrink:0}
header .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .st{font-size:11px;color:var(--dim)}
header .mid{min-width:0;margin-right:auto}

/* ══════ 消息区 ══════ */
#log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:78%;padding:11px 15px;border-radius:16px;white-space:pre-wrap;
   word-break:break-word;font-size:15px}
.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.ta{align-self:flex-start;background:#f7f8fa;border:1px solid var(--line);border-bottom-left-radius:5px}
.sys{align-self:center;color:var(--dim);font-size:13px;text-align:center}

/* ══════ 输入区 ══════ */
#bar{flex-shrink:0;padding:12px 16px;background:var(--card);border-top:1px solid var(--line);
     display:flex;gap:10px;align-items:flex-end}
#msg{flex:1;padding:11px 14px;border-radius:20px;border:1px solid var(--line);background:#f7f8fa;
     color:var(--fg);font:inherit;resize:none;outline:none;max-height:120px;line-height:1.5}
#msg:focus{border-color:var(--accent)}
#send{padding:0 20px;height:42px;border-radius:20px;border:none;background:var(--accent);
      color:#fff;font:inherit;font-weight:600;cursor:pointer;flex-shrink:0}
#send:disabled{opacity:.5;cursor:not-allowed}

/* ══════ 遮罩 ══════ */
.mask{position:fixed;inset:0;background:rgba(15,20,30,.38);z-index:40;opacity:0;
      pointer-events:none;transition:opacity .25s}
.mask.on{opacity:1;pointer-events:auto}

/* ══════ 左侧人物列表抽屉 ══════ */
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(310px,84vw);background:var(--card);
        border-right:1px solid var(--line);z-index:50;transform:translateX(-102%);
        transition:transform .28s cubic-bezier(.3,.9,.4,1);display:flex;flex-direction:column}
#drawer.on{transform:translateX(0)}
#drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;
            align-items:center;justify-content:space-between}
#drawer .dh h3{margin:0;font-size:15px}
#drawer .dl{flex:1;overflow-y:auto;padding:10px}
.pitem{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:11px;
       cursor:pointer;transition:.15s;text-decoration:none;color:inherit}
.pitem:hover{background:#f0f2f5}
.pitem.cur{background:#eef2ff;border:1px solid #c7d2fe}
.pitem img,.pitem .ph{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#f0f2f5;
       display:flex;align-items:center;justify-content:center;color:#9aa3b2;font-size:17px;flex-shrink:0}
.pitem .pnm{font-weight:600;font-size:14px}
.pitem .pmeta{font-size:11px;color:var(--dim)}
#drawer .df{padding:12px;border-top:1px solid var(--line)}
#drawer .df button{width:100%;padding:11px;border-radius:10px;border:1px dashed var(--line);
                   background:transparent;color:var(--dim);font:inherit;cursor:pointer}
#drawer .df button:hover{color:var(--fg);border-color:var(--accent)}

/* ══════ 右侧设置面板 ══════ */
#settings{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:var(--card);
          border-left:1px solid var(--line);z-index:50;transform:translateX(102%);
          transition:transform .28s cubic-bezier(.3,.9,.4,1);display:flex;flex-direction:column}
#settings.on{transform:translateX(0)}
#settings .sh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;
              align-items:center;justify-content:space-between}
#settings .sh h3{margin:0;font-size:15px}
#settings .sb{flex:1;overflow-y:auto;padding:18px}
.sblock{margin-bottom:26px}
.sblock h4{margin:0 0 10px;font-size:12px;color:var(--dim);font-weight:600;
           letter-spacing:.06em;text-transform:uppercase}
.sblock label{display:block;font-size:12px;color:var(--dim);margin:10px 0 5px}
.sblock input,.sblock textarea{width:100%;padding:10px 12px;border-radius:9px;
       border:1px solid var(--line);background:#f7f8fa;color:var(--fg);font:inherit;outline:none}
.sblock input:focus,.sblock textarea:focus{border-color:var(--accent)}
.sblock textarea{resize:vertical;line-height:1.7}
.avrow{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.avrow img{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#f0f2f5;
           border:2px solid var(--line);flex-shrink:0}
.sbtn{display:block;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);
      background:transparent;color:var(--fg);font:inherit;cursor:pointer;text-align:center;
      margin-bottom:9px;transition:.15s;text-decoration:none}
.sbtn:hover{border-color:var(--accent);background:#f4f6f9}
.sbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.sbtn.danger{color:var(--danger);border-color:#4a2222}
.sbtn.danger:hover{background:#2b1616;border-color:var(--danger)}
.hint{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(12px);
       background:#fff;border:1px solid var(--line);color:var(--fg);box-shadow:0 4px 20px rgba(0,0,0,.1);padding:10px 18px;
       border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <button class="iconbtn" id="btnDrawer" title="人物列表">☰</button>
  {% if persona.avatar %}
    <img src="/avatar/{{ persona.avatar }}" alt="">
  {% else %}
    <div class="ph">{{ persona.name[:1] }}</div>
  {% endif %}
  <div class="mid">
    <div class="nm">{{ persona.name }}</div>
    <div class="st">在线</div>
  </div>
  <button class="iconbtn" id="btnSettings" title="设置">⚙</button>
</header>

<div id="log"></div>

<div id="bar">
  <textarea id="msg" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="send">发送</button>
</div>

<!-- 遮罩 -->
<div class="mask" id="mask"></div>

<!-- 左侧：人物列表 -->
<aside id="drawer">
  <div class="dh">
    <h3>我的伴侣</h3>
    <button class="iconbtn" id="btnCloseDrawer">✕</button>
  </div>
  <div class="dl" id="plist"></div>
  <div class="df">
    <button id="btnNew">＋ 新建一个伴侣</button>
  </div>
</aside>

<!-- 右侧：设置面板 -->
<aside id="settings">
  <div class="sh">
    <h3>设置</h3>
    <button class="iconbtn" id="btnCloseSettings">✕</button>
  </div>
  <div class="sb">

    <!-- 人设 -->
    <div class="sblock">
      <h4>人设</h4>
      <div class="avrow">
        {% if persona.avatar %}
          <img id="avImg" src="/avatar/{{ persona.avatar }}" alt="">
        {% else %}
          <img id="avImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 76 76'%3E%3Crect width='76' height='76' fill='%23f0f2f5'/%3E%3Ctext x='38' y='48' font-size='28' text-anchor='middle' fill='%239aa3b2'%3E%3F%3C/text%3E%3C/svg%3E" alt="">
        {% endif %}
        <div style="flex:1">
          <input type="file" id="avFile" accept="image/*" style="font-size:12px;padding:0;border:none;background:none">
          <div class="hint">更换头像，会自动裁成正方形</div>
        </div>
      </div>

      <label>名字</label>
      <input id="fName" value="{{ persona.name }}">

      <label>一句话简介</label>
      <input id="fBrief" value="{{ persona.brief }}" placeholder="当初你是怎么描述它的">

      <label>完整人设</label>
      <textarea id="fPersona" rows="12">{{ persona.persona }}</textarea>
      <button class="sbtn primary" id="btnSavePersona" style="margin-top:12px">保存修改</button>
    </div>

    <!-- 定时问候 -->
    <div class="sblock">
      <h4>定时问候</h4>
      <div id="schedList"></div>
      <button class="sbtn" id="btnAddSched" style="margin-top:8px">＋ 添加一个时刻</button>
      <div class="hint">服务运行时到点自动发问候。需要本程序保持运行。</div>
    </div>

    <!-- 对话 -->
    <div class="sblock">
      <h4>对话记录</h4>
      <a class="sbtn" id="btnExportMd" href="/api/chat/{{ persona.id }}/export?format=md" download>导出为 Markdown</a>
      <a class="sbtn" id="btnExportJson" href="/api/chat/{{ persona.id }}/export?format=json" download>导出为 JSON（含人设）</a>
      <button class="sbtn danger" id="btnClearHistory">清除聊天记录</button>
      <div class="hint">导出会在浏览器下载文件。清除聊天记录不可撤销。</div>
    </div>

    <!-- 危险操作 -->
    <div class="sblock">
      <h4>删除</h4>
      <button class="sbtn danger" id="btnDeletePersona">删除这个人物</button>
      <div class="hint">连同人设、头像、全部对话一起删除，不可恢复。</div>
    </div>

  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
const PID = {{ persona.id|tojson }};
const PNAME = {{ persona.name|tojson }};
const $ = s => document.querySelector(s);
const log = $('#log'), msgBox = $('#msg'), sendBtn = $('#send');
let busy = false;

function toast(t) {
  const el = $('#toast');
  el.textContent = t; el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2200);
}
function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'm ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

/* ══════ 对话 ══════ */
fetch('/api/chat/' + encodeURIComponent(PID) + '/history')
  .then(r => r.json())
  .then(list => {
    if (!list.length) { add('开始和 ' + PNAME + ' 聊天吧', 'sys'); return; }
    list.forEach(m => add(m.content, m.role === 'user' ? 'me' : 'ta'));
  })
  .catch(() => add('读取历史失败', 'sys'));

async function doSend() {
  const text = msgBox.value.trim();
  if (!text || busy) return;
  msgBox.value = ''; msgBox.style.height = 'auto';
  add(text, 'me');
  busy = true; sendBtn.disabled = true;
  const tip = add('正在输入…', 'sys');
  try {
    const r = await fetch('/api/chat/' + encodeURIComponent(PID), {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const d = await r.json();
    tip.remove();
    if (d.ok) add(d.reply, 'ta');
    else add('出错了：' + (d.message || '未知错误'), 'sys');
  } catch (e) {
    tip.remove();
    add('网络错误：' + e.message, 'sys');
  }
  busy = false; sendBtn.disabled = false; msgBox.focus();
}
sendBtn.onclick = doSend;
msgBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});
msgBox.addEventListener('input', () => {
  msgBox.style.height = 'auto';
  msgBox.style.height = Math.min(msgBox.scrollHeight, 120) + 'px';
});

/* ══════ 抽屉 / 面板 ══════ */
const mask = $('#mask'), drawer = $('#drawer'), settings = $('#settings');
function closeAll() {
  drawer.classList.remove('on');
  settings.classList.remove('on');
  mask.classList.remove('on');
}
$('#btnDrawer').onclick = () => {
  loadPersonaList();
  drawer.classList.add('on'); mask.classList.add('on');
  settings.classList.remove('on');
};
$('#btnSettings').onclick = () => {
  settings.classList.add('on'); mask.classList.add('on');
  drawer.classList.remove('on');
};
$('#btnCloseDrawer').onclick = closeAll;
$('#btnCloseSettings').onclick = closeAll;
mask.onclick = closeAll;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAll();
});
$('#btnNew').onclick = () => { location.href = '/wizard'; };

/* ══════ 人物列表 ══════ */
async function loadPersonaList() {
  const box = $('#plist');
  box.innerHTML = '<div class="hint" style="padding:12px">加载中…</div>';
  try {
    const list = await (await fetch('/api/personas')).json();
    box.innerHTML = '';
    list.forEach(p => {
      const a = document.createElement('a');
      a.className = 'pitem' + (p.id === PID ? ' cur' : '');
      a.href = '/chat/' + encodeURIComponent(p.id);
      a.innerHTML = (p.avatar
          ? `<img src="/avatar/${p.avatar}" alt="">`
          : `<div class="ph">${esc(p.name.slice(0,1))}</div>`)
        + `<div><div class="pnm">${esc(p.name)}</div>
             <div class="pmeta">${p.history_count} 条对话</div></div>`;
      box.appendChild(a);
    });
    if (!list.length) box.innerHTML = '<div class="hint" style="padding:12px">还没有伴侣</div>';
  } catch (e) {
    box.innerHTML = '<div class="hint" style="padding:12px">加载失败</div>';
  }
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ══════ 设置：保存人设 ══════ */
$('#btnSavePersona').onclick = async () => {
  const body = {
    name: $('#fName').value.trim(),
    brief: $('#fBrief').value,
    persona: $('#fPersona').value
  };
  if (!body.name) { toast('名字不能为空'); return; }
  const r = await fetch('/api/persona/' + encodeURIComponent(PID) + '/update', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const d = await r.json();
  if (d.ok) {
    await saveSchedule();
    toast('已保存');
    setTimeout(() => location.reload(), 700);
  }
  else toast('保存失败：' + (d.message || ''));
};

/* ══════ 设置：更换头像 ══════ */
$('#avFile').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  const fd = new FormData(); fd.append('avatar', f);
  toast('上传中…');
  try {
    const r = await fetch('/api/persona/' + encodeURIComponent(PID) + '/avatar',
                          {method: 'POST', body: fd});
    const d = await r.json();
    if (d.ok) {
      $('#avImg').src = '/avatar/' + d.avatar + '?t=' + Date.now();
      toast('头像已更新');
    } else toast('上传失败：' + (d.message || ''));
  } catch (err) { toast('上传失败'); }
};

/* ══════ 设置：定时问候 ══════ */
const KIND_LABEL = {morning:"早安", noon:"午安", dinner:"晚饭", night:"晚安"};

async function loadSchedule() {
  const box = $('#schedList');
  try {
    const rows = await (await fetch('/api/schedule/' + encodeURIComponent(PID))).json();
    box.innerHTML = rows.length ? '' : '<div class="hint">还没有设置时刻</div>';
    rows.forEach((r, i) => {
      const d = document.createElement('div');
      d.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:8px';
      d.innerHTML = `<input type="time" value="${r.at}" data-i="${i}" class="scTime"
                        style="flex:0 0 110px;padding:8px 10px;border-radius:8px;
                               border:1px solid var(--line);background:#f7f8fa;color:var(--fg)">
                     <select data-i="${i}" class="scKind"
                        style="flex:1;padding:8px 10px;border-radius:8px;
                               border:1px solid var(--line);background:#f7f8fa;color:var(--fg)">
                       ${Object.entries(KIND_LABEL).map(([k,v]) =>
                          `<option value="${k}"${k===r.kind?' selected':''}>${v}</option>`).join('')}
                     </select>
                     <button class="scDel" data-i="${i}"
                        style="padding:8px 11px;border-radius:8px;border:1px solid var(--line);
                               background:#fff;color:var(--danger);cursor:pointer">删</button>`;
      box.appendChild(d);
    });
    box.querySelectorAll('.scDel').forEach(btn => {
      btn.onclick = () => { btn.closest('div').remove(); };
    });
  } catch(e) { box.innerHTML = '<div class="hint">读取失败</div>'; }
}

$('#btnAddSched').onclick = () => {
  const box = $('#schedList');
  if (box.querySelector('.hint')) box.innerHTML = '';
  const d = document.createElement('div');
  d.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:8px';
  d.innerHTML = `<input type="time" value="09:00" class="scTime"
                    style="flex:0 0 110px;padding:8px 10px;border-radius:8px;
                           border:1px solid var(--line);background:#f7f8fa;color:var(--fg)">
                 <select class="scKind"
                    style="flex:1;padding:8px 10px;border-radius:8px;
                           border:1px solid var(--line);background:#f7f8fa;color:var(--fg)">
                   ${Object.entries(KIND_LABEL).map(([k,v]) =>
                      `<option value="${k}">${v}</option>`).join('')}
                 </select>
                 <button class="scDel"
                    style="padding:8px 11px;border-radius:8px;border:1px solid var(--line);
                           background:#fff;color:var(--danger);cursor:pointer">删</button>`;
  box.appendChild(d);
  d.querySelector('.scDel').onclick = () => d.remove();
};

// 保存定时设置（点"保存修改"时一起保存）
async function saveSchedule() {
  const rows = [];
  document.querySelectorAll('#schedList > div').forEach(d => {
    const t = d.querySelector('.scTime'), k = d.querySelector('.scKind');
    if (t && k) rows.push({at: t.value, kind: k.value});
  });
  await fetch('/api/schedule/' + encodeURIComponent(PID), {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({schedule: rows})
  });
}
loadSchedule();

/* ══════ 设置：清除记录 ══════ */
$('#btnClearHistory').onclick = async () => {
  if (!confirm('清空和 ' + PNAME + ' 的全部聊天记录？\n\n这个操作不能撤销，建议先导出备份。')) return;
  await fetch('/api/chat/' + encodeURIComponent(PID) + '/history', {method: 'DELETE'});
  log.innerHTML = '';
  add('记录已清空', 'sys');
  toast('已清除');
  closeAll();
};

/* ══════ 设置：删除人物 ══════ */
$('#btnDeletePersona').onclick = async () => {
  const input = prompt('删除「' + PNAME + '」会连同人设、头像、全部对话一起删除，无法恢复。\n\n'
                     + '确认请在下框输入它的名字：');
  if (input === null) return;
  if (input.trim() !== PNAME) { toast('名字不对，已取消'); return; }
  const r = await fetch('/api/persona/' + encodeURIComponent(PID), {method: 'DELETE'});
  const d = await r.json();
  if (d.ok) { location.href = '/app'; }
  else toast('删除失败');
};
</script>
</body>
</html>
