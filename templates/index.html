<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的伴侣 · OpenCompanion</title>
<style>
:root{--bg:#ffffff;--card:#ffffff;--line:#e3e6eb;--fg:#1a1d23;--dim:#6b7280;--accent:#4b6ef5;--ok:#12a15c;--err:#d93025;--danger:#d93025}
*{box-sizing:border-box}
body{margin:0;font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
     background:var(--bg);color:var(--fg);min-height:100vh;padding:40px 16px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:24px;margin:0 0 6px}
.sub{color:var(--dim);margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;
   text-decoration:none;color:inherit;display:flex;gap:14px;align-items:center;transition:.15s}
.p:hover{border-color:var(--accent);transform:translateY(-2px)}
.p img,.p .ph{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#f0f2f5;flex-shrink:0;
   display:flex;align-items:center;justify-content:center;font-size:22px;color:#9aa3b2}
.p .info{min-width:0}
.p .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .meta{font-size:12px;color:var(--dim)}
.add{border-style:dashed;justify-content:center;font-size:15px;color:var(--dim)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.badge{font-size:12px;padding:3px 9px;border-radius:20px;background:#eef2ff;color:var(--accent)}
a.plain{color:var(--dim);font-size:13px;text-decoration:none}
a.plain:hover{color:var(--fg)}
</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OpenCompanion">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" sizes="180x180" href="/static/brand/touch-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/static/brand/touch-192.png">
<link rel="icon" href="/static/brand/favicon.png">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>我的伴侣</h1>
      <div class="sub" style="margin:0">点一个开始聊天</div>
    </div>
    <div>
      <span class="badge">{{ cfg.model }}</span>
      <a class="plain" href="/wizard" style="margin-left:12px">＋ 新建</a>
    </div>
  </div>

  <div class="grid">
    {% for p in personas %}
    <a class="p" href="/chat/{{ p.id }}">
      {% if p.avatar %}
        <img src="/avatar/{{ p.avatar }}" alt="">
      {% else %}
        <div class="ph">{{ p.name[:1] }}</div>
      {% endif %}
      <div class="info">
        <div class="nm">{{ p.name }}</div>
        <div class="meta">{{ p.history_count }} 条对话{% if not p.has_persona %} · 未完善人设{% endif %}</div>
      </div>
    </a>
    {% endfor %}
    <a class="p add" href="/wizard">＋ 新建一个伴侣</a>
  </div>
</div>
</body>
</html>
